name: company-mod
on:
  push:
    paths: ['claude-company-mods/**', '.github/workflows/company-mod.yml']
  pull_request:
    paths: ['claude-company-mods/**', '.github/workflows/company-mod.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      R: claude-company-mods/company
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @anthropic-ai/claude-code@2.1.332
      # types/ is git-ignored; the engine writes it when it loads a mod from a dev-mods folder.
      - name: Write engine types
        env: { ANTHROPIC_API_KEY: ci-placeholder }  # load needs no login; the call after load may fail
        run: |
          H=$(mktemp -d); SID=$(python3 -c 'import uuid;print(uuid.uuid4())')
          D=$H/.claude/dev-mods/$SID; mkdir -p $D; cp -r "$R" $D/company
          HOME=$H timeout 120 claude -p hi --tools "Agent,Bash,Edit,Glob,Grep,NotebookEdit,Read,Write" --session-id $SID --plugin-dir $D/company || true
          if [ -d $D/company/.claude-plugin/types ]; then cp -r $D/company/.claude-plugin/types "$R/.claude-plugin/"
          else echo "::error::no engine types written"; exit 1; fi
      - run: bash claude-company-mods/check.sh
      - run: python3 -m py_compile claude-company-mods/measure/*.py
      # Fixture 3 self-test: pytest at the version in fixture3/README.md; T1-big needs commit
      # 4b40414, so fetch that one commit into the shallow checkout.
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Fixture 3 self-test
        run: |
          V=$(grep -oE 'pytest [0-9]+\.[0-9]+\.[0-9]+' claude-company-mods/measure/fixture3/README.md | head -1 | cut -d' ' -f2)
          python3 -m pip install "pytest==$V"
          git fetch --no-tags --depth=1 origin 4b40414ba7be15c00e1d0f85cbc77655eebeb2db
          python3 -I claude-company-mods/measure/fixture3/test_gen.py
