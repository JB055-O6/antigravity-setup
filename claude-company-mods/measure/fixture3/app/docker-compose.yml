services:
  app:
    build: .
    environment:
      SHOP_GATEWAY_URL: https://pay.example-gw.internal/v2/charge
      SHOP_PAYMENT_TIMEOUT_MS: "10000"
      SHOP_BREAKER_FAILURES: "3"
    volumes:
      - shop-data:/app/data
    expose:
      - "8080"
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  shop-data:
